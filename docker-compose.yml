version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: legal_tantra_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./legaltantra.db
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
    container_name: legal_tantra_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  backend_data:
