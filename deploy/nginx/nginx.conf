# ==============================================================================
# LEGAL TANTRA - PRODUCTION NGINX REVERSE PROXY & WAF CONFIGURATION
# Features:
# - TLS 1.2/1.3 Hardened HTTPS Termination
# - OWASP Recommended Security Headers
# - Sliding-Window Rate Limiting (General vs High-Cost AI Endpoints)
# - Request Body Size Caps (1MB JSON / 10MB Document Analysis)
# - ModSecurity v3 / OWASP Core Rule Set (CRS) Integration Ready
# - Network Isolation (Port 8000 backend not exposed externally)
# ==============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Privacy-Conscious Log Format: Strip full query parameters and request bodies
    log_format  privacy_combined  '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $uri $server_protocol" '
                                  '$status $body_bytes_sent "$http_referer" '
                                  '"$http_user_agent" $request_time';

    access_log  /var/log/nginx/access.log  privacy_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off; # Prevent Nginx banner leakage

    # --------------------------------------------------------------------------
    # RATE LIMITING ZONES
    # --------------------------------------------------------------------------
    # General endpoints: 60 requests/minute per client IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

    # Heavy AI endpoints (chat intake, document analyzer, summary): 15 requests/minute
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=15r/m;

    limit_req_status 429;

    # --------------------------------------------------------------------------
    # SSL/TLS GLOBAL SETTINGS (Mozilla Modern Security Profile)
    # --------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # HTTP REDIRECT -> HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name legaltantra.in www.legaltantra.in localhost;

        # Acmetool / Certbot challenge support
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS PRODUCTION REVERSE PROXY
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name legaltantra.in www.legaltantra.in localhost;

        # SSL Certificates (Configure paths appropriately)
        ssl_certificate     /etc/ssl/certs/legaltantra.crt;
        ssl_certificate_key /etc/ssl/private/legaltantra.key;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://legaltantra.in;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Default Request Body Limit for General Traffic (1MB)
        client_max_body_size 1M;

        # ----------------------------------------------------------------------
        # ModSecurity v3 / OWASP CRS Integration (When compiled with Nginx)
        # ----------------------------------------------------------------------
        # modsecurity on;
        # modsecurity_rules_file /etc/nginx/modsec/main.conf;

        # ----------------------------------------------------------------------
        # FRONTEND STATIC ASSETS / REACT SPA
        # ----------------------------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Browser caching for immutable static assets
            location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
                expires 7d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # ----------------------------------------------------------------------
        # HIGH-COST AI & INCIDENT ANALYSIS ENDPOINTS (STRICT RATE LIMITS)
        # ----------------------------------------------------------------------
        location ~ ^/api/(chat/message|incident/analyze|incident/summary) {
            limit_req zone=ai_limit burst=5 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # DOCUMENT ANALYSIS ENDPOINT (EXPANDED UPLOAD LIMIT UP TO 10MB)
        # ----------------------------------------------------------------------
        location /api/document/analyze {
            limit_req zone=ai_limit burst=3 nodelay;
            client_max_body_size 10M;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 45s;
        }

        # ----------------------------------------------------------------------
        # GENERAL API PROXY
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # BLOCK DISALLOWED HTTP METHODS
        # ----------------------------------------------------------------------
        if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS)$) {
            return 405;
        }
    }
}
